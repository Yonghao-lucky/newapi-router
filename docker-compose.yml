# Isolated local deployment for the video-relay branch.
# Supply the generated runtime .env with --env-file; it is intentionally not
# stored in the repository because it contains database and session secrets.

name: new-api-video-router

services:
  app:
    image: new-api-video-router:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${IMAGE_TAG:-local}
    container_name: new-api-video-router-app
    restart: unless-stopped
    stop_grace_period: 130s
    command: ["--log-dir", "/app/logs"]
    ports:
      - "13000:3000"
    volumes:
      - ${RUNTIME_DIR:-/root/new-api-video-router-runtime}/data:/data
      - ${RUNTIME_DIR:-/root/new-api-video-router-runtime}/logs:/app/logs
      - ${VIDEO_TMP_DIR:-/root/new-api-video-router-runtime/video-tmp}:/video-tmp
    environment:
      SQL_DSN: postgresql://${POSTGRES_USER:-newapi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-new_api}
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      VIDEO_PREPROCESS_TEMP_DIR: /video-tmp
      TZ: ${TZ:-UTC}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-new-api-video-router}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - new-api-video-router-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -Eq '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:15
    container_name: new-api-video-router-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-new_api}
    volumes:
      - new-api-video-router-postgres-data:/var/lib/postgresql/data
    networks:
      - new-api-video-router-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: new-api-video-router-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - new-api-video-router-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  new-api-video-router-postgres-data:
    name: new-api-video-router-postgres-data

networks:
  new-api-video-router-network:
    name: new-api-video-router-network
    driver: bridge
